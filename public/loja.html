<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VitraForma, Gallerie e Sonhos de Açúcar</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Fraunces:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--body:Inter,system-ui,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);max-width:560px;margin-inline:auto;min-height:100vh;transition:background .25s}
[data-store=vitra]{--bg:#F6F3FA;--ink:#150D1F;--card:#fff;--muted:#625A70;--accent:#3B1260;--on:#fff;--hi:#B79AE3;--display:'Bricolage Grotesque',sans-serif}
[data-store=home]{--bg:#F6F4F1;--ink:#241B17;--card:#fff;--muted:#6B625C;--accent:#241B17;--on:#fff;--hi:#E8D9C5;--display:Fraunces,serif}
[data-store=chocolate]{--bg:#FAF1F0;--ink:#2B0F13;--card:#fff;--muted:#7A5A5E;--accent:#6E1423;--on:#fff;--hi:#D4AF5A;--display:Fraunces,serif}
[data-store=aromas]{--bg:#F1F5EC;--ink:#2A3324;--card:#fff;--muted:#6A7660;--accent:#4F6B3A;--on:#fff;--hi:#B9CFA0;--display:Fraunces,serif}
[data-store=galerie]{--bg:#EDF8F7;--ink:#10302F;--card:#fff;--muted:#4F6F6D;--accent:#0B7F7B;--on:#fff;--hi:#81D8D0;--display:Fraunces,serif}
[data-store=doces]{--bg:#FBEFE8;--ink:#4A2A22;--card:#fff;--muted:#8A6A60;--accent:#B85446;--on:#fff;--hi:#F4B8A4;--display:Fraunces,serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) [data-store]{--bg:#12141A;--ink:#F1F1F4;--card:#1D2029;--muted:#A3A8B8;--accent:var(--hi);--on:#14161C}}
header{padding:16px 16px 8px}
h1{font:700 28px/1.1 var(--display);margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tabs button{font:500 14px var(--body);padding:9px 16px;border-radius:20px;border:1px solid var(--muted);background:transparent;color:var(--ink);white-space:nowrap;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--accent);color:var(--on);border-color:var(--accent)}
.banner{margin:12px 16px;padding:18px;border-radius:14px;background:var(--hi);color:#14161C;font:700 18px/1.25 var(--display)}
.banner small{display:block;font:400 13px var(--body);margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:4px 16px 110px}
.card{background:var(--card);border-radius:14px;padding:10px;text-align:left;border:1px solid transparent;cursor:pointer;color:var(--ink);font-family:var(--body)}
.card:hover{border-color:var(--accent)}
.ph{overflow:hidden;aspect-ratio:1;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;margin-bottom:8px;border:1px dashed var(--muted)}
.ph img{width:100%;height:100%;object-fit:cover}
.card b{display:block;font:500 15px var(--body)}
.card span{font-size:13px;color:var(--muted)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:5}
#sheet.open{display:flex}
.panel{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.panel h2{font:700 22px var(--display);margin:0 0 4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.chips button{font:500 14px var(--body);padding:8px 14px;border-radius:10px;border:1px solid var(--muted);background:transparent;color:var(--ink);cursor:pointer}
.chips button[aria-pressed=true]{border:2px solid var(--accent);padding:7px 13px;background:var(--bg)}
label{font-size:13px;color:var(--muted)}
textarea{width:100%;font:15px var(--body);border-radius:10px;border:1px solid var(--muted);background:var(--bg);color:var(--ink);padding:10px;margin:4px 0 14px;resize:none}
.btn{width:100%;font:500 16px var(--body);padding:14px;border-radius:12px;border:0;background:var(--accent);color:var(--on);cursor:pointer}
.btn.wa{background:#1FA855;color:#fff}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:none;z-index:4}
.bar.show{display:block}
.bar .btn{max-width:528px;display:block;margin:auto}
.line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bg);font-size:14px}
.line small{display:block;color:var(--muted)}
.x{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline}
.close{float:right;background:none;border:0;color:var(--muted);font-size:14px;cursor:pointer}
.fil{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 8px}.fil button{font:500 13px var(--body);padding:6px 12px;border-radius:16px;border:1px solid var(--muted);background:transparent;color:var(--ink);white-space:nowrap;cursor:pointer}.fil button[aria-pressed=true]{background:var(--hi);border-color:var(--hi);color:#14161C}
.hgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px;padding:8px 16px 24px}.circ{background:none;border:0;text-align:center;cursor:pointer;color:var(--ink);font-family:var(--body);padding:0}.disc{width:104px;height:104px;border-radius:50%;margin:auto;border:3px solid var(--c);display:flex;align-items:center;justify-content:center;overflow:hidden;font:700 36px var(--display);color:var(--c)}.disc img{width:100%;height:100%;object-fit:cover}.circ b{display:block;margin-top:8px;font:500 15px var(--body)}.circ span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.note{font-size:12px;color:var(--muted);text-align:center;padding:0 16px 16px}
</style>
</head>
<body data-store="vitra">
<section id="home"></section><div id="store"><header>
  <h1 id="name">VitraForma</h1>
  <p class="sub" id="tag">Peças impressas em 3D, do jeito que você pedir</p>
  <div class="tabs" id="tabs"></div>
</header>
<div class="banner" id="banner"></div>
<div id="filters"></div><main class="grid" id="grid"></main>
<p class="note">Protótipo visual: fotos, preços e telefones são exemplos.</p></div>
<div class="bar" id="bar"><button class="btn" id="openCart"></button></div>
<div id="sheet"><div class="panel" id="panel"></div></div>
